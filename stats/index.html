<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白衣的算法实践 · 统计</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #232838;
    --accent: #4f8cff;
    --text: #e6e9f0;
    --muted: #8a90a0;
    --border: #2a2f3d;
    --code-bg: #0b0d12;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px 60px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); margin-top: 8px; font-size: 14px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 40px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat-card .label { color: var(--muted); margin-top: 8px; font-size: 14px; }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    margin: 24px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count-badge {
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 20px;
  }

  .file-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .file-card:hover { border-color: var(--accent); }
  .file-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }
  .file-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: #2c3350;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
    flex-shrink: 0;
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-meta .fname {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-meta .fsub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .chevron { color: var(--muted); transition: transform 0.2s; font-size: 14px; flex-shrink: 0; }
  .file-card.open .chevron { transform: rotate(90deg); }

  .code-wrap { display: none; border-top: 1px solid var(--border); }
  .file-card.open .code-wrap { display: block; }
  .code-wrap pre {
    background: var(--code-bg);
    padding: 18px 20px;
    overflow-x: auto;
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.6;
  }
  .copy-btn {
    float: right;
    margin: 10px 12px 0 0;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .error { text-align: center; color: #ff6b6b; padding: 40px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>白衣的<span>算法实践</span></h1>
    <div class="sub">GitHub 仓库统计 · 本地数据自动生成</div>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="num" id="stat-files">-</div>
      <div class="label">已上传代码题数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-push">-</div>
      <div class="label">上传总次数</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-size">-</div>
      <div class="label">代码总量 (KB)</div>
    </div>
  </div>

  <div class="section-title">
    代码列表
    <span class="count-badge" id="list-count">0</span>
  </div>

  <div id="list"></div>

  <footer>由小脚本 stats/fetch_data.mjs 自动生成 · <span id="gen-time"></span></footer>
</div>

<script>
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function main() {
  let data;
  try {
    const res = await fetch("data.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    document.getElementById("list").innerHTML =
      '<div class="error">⚠️ 无法加载数据。<br>请确认本页面通过 http(s) 访问（GitHub Pages / 本地服务器），且 data.json 已生成。</div>';
    return;
  }

  document.getElementById("stat-files").textContent = data.totalFiles;
  document.getElementById("stat-push").textContent = data.totalPush;
  const sizeKB = (data.files.reduce((a, f) => a + f.size, 0) / 1024).toFixed(1);
  document.getElementById("stat-size").textContent = sizeKB;
  document.getElementById("list-count").textContent = data.files.length;
  document.getElementById("gen-time").textContent =
    "数据生成时间 " + new Date(data.generatedAt).toLocaleString("zh-CN");

  const list = document.getElementById("list");
  if (!data.files.length) {
    list.innerHTML = '<div class="empty">暂无代码文件</div>';
    return;
  }

  data.files.forEach((f) => {
    const card = document.createElement("div");
    card.className = "file-card";

    const header = document.createElement("div");
    header.className = "file-header";
    header.innerHTML =
      '<div class="file-icon">CPP</div>' +
      '<div class="file-meta">' +
        '<div class="fname"></div>' +
        '<div class="fsub"></div>' +
      '</div>' +
      '<div class="chevron">▶</div>';
    header.querySelector(".fname").textContent = f.name;
    header.querySelector(".fsub").textContent =
      (f.size / 1024).toFixed(1) + " KB · " + (f.path || f.name);

    const codeWrap = document.createElement("div");
    codeWrap.className = "code-wrap";
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "复制";
    copyBtn.onclick = (ev) => {
      ev.stopPropagation();
      navigator.clipboard.writeText(f.code);
      copyBtn.textContent = "已复制";
      setTimeout(() => (copyBtn.textContent = "复制"), 1500);
    };
    const pre = document.createElement("pre");
    pre.textContent = f.code;
    codeWrap.appendChild(copyBtn);
    codeWrap.appendChild(pre);

    header.onclick = () => card.classList.toggle("open");

    card.appendChild(header);
    card.appendChild(codeWrap);
    list.appendChild(card);
  });
}

main();
</script>
</body>
</html>
