name: Update Stats

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'
      - '**.md'
      - 'stats/fetch_data.mjs'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Generate stats data
      run: |
        cd /home/runner/work/algorithm-practice/algorithm-practice
        node stats/fetch_data.mjs
    
    - name: Commit and push updated stats
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add stats/data.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update stats data $(date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi